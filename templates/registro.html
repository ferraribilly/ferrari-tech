<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#fff">
        <title>Registro usuarios</title>
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='w.png') }}">
        <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='w.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

 <body class="bg-light">
</div>
<div  class="container py-4">
    <h1 class="text-center mb-4"></h1>
    <!-- Formulário de Registro -->
    <div style="background-color: rgba(248, 246, 248, 0.793); text-align: center;" class="card mb-4">
        <div style="text-align: center; font-family: monospace; font-weight: bold;"></div>
        <div class="card-body">
            
            <form style="font-family:monospace; font-weight: bold;" id="formRegistro">
                   <img 
    src="../static/img/marca.png"
    style="display: block; margin: 0 auto; width:100%; height: 100%;">


    <div class="mb-3">
        <input id="nome" type="text" class="form-control" name="nome" placeholder="Digite seu nome" required>
    </div>

    <div class="mb-3">
        <input id="sobrenome" type="text" class="form-control" name="sobrenome" placeholder="Digite seu sobrenome" required>
    </div>

    <div class="mb-3">
        <input id="cpf" type="text" class="form-control" name="cpf" placeholder="Digite seu CPF (s/ Pontos)" pattern="\d{11}" required>
    </div>

 <div class="mb-3">
       <label style="font-family:monospace; font-weight: bold;"  >Data Nascimento</label>
    <input id="dt_nascimento" type="date" class="form-control" name="dt_nascimento" required>
</div>

    <div class="mb-3">
        <input id="email" type="text" class="form-control" name="email" placeholder="Digite seu email" required>
    </div>

    <div class="mb-3">
    <select id="estado" name="estado" class="form-select" required style="border-radius: 5px;">
        <option value="" selected disabled>Selecione seu Estado</option>
        <!-- O JavaScript preencherá o restante -->
    </select>
    </div>

    

    <!-- VENDEDOR TEM QUE FICAR AQUI -->
    <div class="mb-3">
        <label for="vendedorInput" class="form-label">Lista Indicação</label>

        <input type="text" 
               class="form-control" 
               id="vendedorInput" 
               name="vendedor" 
               placeholder="Clique para selecionar..."
               data-bs-toggle="modal" 
               data-bs-target="#vendedorModal"
               readonly
               required>
    </div>

    <div class="mb-3">
        <input id="chave_pix" type="text" class="form-control" name="chave_pix" placeholder="Digite sua chave PIX" required>
    </div>

    <!-- BOTÃO SEMPRE POR ÚLTIMO -->
    <button style="border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: bold; transition: all 0.3s ease;" type="submit" class="btn btn-success w-100">
        Confirmar Registro
    </button>

        <!-- Botão Voltar -->
    <a href="/vitoria_vitoriosa/login" class="btn-voltar"><span class="seta">←</span> Voltar</a>
 

      <!-- Aviso de Segurança -->
    <div id="segurity-notice" class="security-notice">
        <div class="security-icon">🔒</div>
        <p class="security-text">
            <strong>Segurança Total:</strong> Seus dados são coletados e protegidos por criptografia de ponta a ponta. Apenas você e o destinatário final têm acesso às informações.
        </p>
    </div>
</form>
            <div id="registroMsg" class="mt-2"></div>
        </div>
    </div>
</div>


<!-- MODAL (FALTAVA) -->
<div class="modal fade" id="vendedorModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Selecione um Vendedor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      

 <div class="modal-body p-0">
  <div class="list-group list-group-flush">
    {% for u in vendedores %}
      <button type="button" class="list-group-item list-group-item-action vendor-option">
        {{ u.nome }}
      </button>
    {% endfor %}
  </div>
</div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/registro_login.js') }}"></script>

</body>
</html>
