<script>
const socket = io('/sorteio');
let historico = [];

// --- PERSISTÊNCIA: Recupera números já salvos no banco ---
// Convertendo explicitamente para garantir que o JS entenda como array
const numerosIniciais = {{ projeto_principal.numeros_sorteados | tojson | safe if projeto_principal and projeto_principal.numeros_sorteados else '[]' }};

function aplicarCores() {
    document.querySelectorAll("#vencedor .user-entry").forEach((linha, index) => {
        const cor = `hsl(${(index * 137) % 360}, 80%, 60%)`;
        const tdNome = linha.querySelector(".nome");
        const tdCidade = linha.querySelector(".cidade");
        if (tdNome) {
            tdNome.style.color = cor;
            tdNome.style.fontWeight = "bold";
        }
        if (tdCidade) {
            tdCidade.style.color = cor;
            tdCidade.style.fontWeight = "bold";
        }
    });
}

// Função única para marcar a bolinha na tabela
function marcarBolinhaNaTabela(num) {
    // Busca pelo atributo value igual ao número (seja string ou número)
    const bolas = document.querySelectorAll('.bolinha, .bolinha2');
    bolas.forEach(el => {
        if (el.getAttribute('value') == num) {
            el.classList.remove('bolinha', 'bolinha2');
            el.classList.add('marcado');
        }
    });
}

document.addEventListener("DOMContentLoaded", function() {
    aplicarCores();

    if (numerosIniciais && numerosIniciais.length > 0) {
        // Ordenamos para manter a lógica de histórico, mas marcamos todos
        numerosIniciais.forEach(num => {
            marcarBolinhaNaTabela(num);
            historico.unshift(num); // Adiciona ao início do histórico
        });

        // Atualiza o visual do histórico (quadradinhos de baixo)
        document.getElementById('ultimo').innerText = historico[0] || '';
        document.getElementById('penultimo').innerText = historico[1] || '';
        document.getElementById('antepenultimo').innerText = historico[2] || '';
        document.getElementById('anteantepenultimo').innerText = historico[3] || '';
        
        // Mostra o último sorteado na bola grande
        document.getElementById('mostrar_num').innerText = historico[0];
    }
});

socket.on('novo_numero', function(data) {
    const num = data.numero;
    document.getElementById('mostrar_num').innerText = num;

    historico.unshift(num);
    if(historico.length > 10) historico.pop();

    setTimeout(() => {
        marcarBolinhaNaTabela(num);
        document.getElementById('ultimo').innerText = historico[0] || '';
        document.getElementById('penultimo').innerText = historico[1] || '';
        document.getElementById('antepenultimo').innerText = historico[2] || '';
        document.getElementById('anteantepenultimo').innerText = historico[3] || '';

        if(data.mensagem){
            let html = `<p class="mensagem">${data.mensagem}</p>`;
            if(data.bilhete){
                html += `
                    <div class="bilhete-card">
                        <p><strong>ID:</strong> ${data.bilhete._id}</p>
                        <p><strong>Nome:</strong> ${data.bilhete.nome_usuario}</p>
                        <p><strong>CPF:</strong> ${data.bilhete.cpf}</p>
                        <p><strong>Números:</strong> ${data.bilhete.lista_numeros.join(', ')}</p>
                        <img src="${data.bilhete.lista_urls_img_bilhetes[0]}" 
                             alt="Bilhete" 
                             class="bilhete-img">
                    </div>
                `;
            }
            document.getElementById('resultado').innerHTML = html;
        }
    }, 1000);
});

socket.on('usuarios_atualizados', function(data) {
    const container = document.getElementById('vencedor');
    if(!container) return;
    
    container.innerHTML = '';
    const vistos = new Set();
    const usuariosUnicos = data.usuarios.filter(u => {
        if (vistos.has(u.nome_usuario)) return false;
        vistos.add(u.nome_usuario);
        return true;
    });

    usuariosUnicos.forEach(b => {
        const div = document.createElement('div');
        div.classList.add('user-entry');
        const imgUrl = (b.lista_urls_img_bilhetes && b.lista_urls_img_bilhetes.length > 0) 
                       ? b.lista_urls_img_bilhetes[0] 
                       : '/static/img/default-user.png';

        div.innerHTML = `
            <img src="${imgUrl}" class="perfil" onclick="abrirImagem(this.src)">
            <span class="nome">${b.nome_usuario}</span>
            <span class="cidade">${b.payment_id}</span>
        `;
        container.appendChild(div);
    });
    aplicarCores();
});

function abrirImagem(src) {
    const modal = document.getElementById("modalImg");
    const img = document.getElementById("imgExpandida");
    if(modal && img) {
        modal.style.display = "flex";
        img.src = src;
    }
}

const modalImg = document.getElementById("modalImg");
if(modalImg) {
    modalImg.onclick = function() { this.style.display = "none"; };
}

var audio = new Audio('/static/audio/confeite.mp3');
var defaults = { spread: 360, ticks: 50, gravity: 0, decay: 0.94, startVelocity: 30, colors: ['FFE400','FFBD00','E89400','FFCA'] };

function shoot() {
    audio.play().catch(e => console.log("Audio esperando interação"));
    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
    confetti({ ...defaults, particleCount: 40, scalar: 1.2, shapes: ['star'] });
}

setTimeout(shoot, 500);
</script>
