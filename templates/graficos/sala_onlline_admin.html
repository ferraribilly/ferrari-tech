<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const socket = io('/sorteio');
let historico = []; // Alterado para let para permitir manipulação

const campo = document.getElementById('campoNumero');
const displayResultado = document.getElementById('resultado');

// Pega o ID do projeto do Flask
const projetoIdAtual = "{{ projeto_id }}"; 

// Recupera números já sorteados do banco (em formato String para comparar fácil)
let numerosJaSorteadosNoBanco = {{ projeto.numeros_sorteados | tojson | safe if projeto.numeros_sorteados else [] }};

function aplicarCores() {
    document.querySelectorAll("#vencedor .user-entry").forEach((linha, index) => {
        const cor = `hsl(${(index * 137) % 360}, 80%, 60%)`;
        const tdNome = linha.querySelector(".nome");
        const tdCidade = linha.querySelector(".cidade");
        if (tdNome) { tdNome.style.color = cor; tdNome.style.fontWeight = "bold"; }
        if (tdCidade) { tdCidade.style.color = cor; tdCidade.style.fontWeight = "bold"; }
    });
}

function addNum(num){
    if(campo.value.length < 2) { campo.value += num; }
}

function apagar(){ campo.value = campo.value.slice(0,-1); }

function limpar(){
    campo.value = '';
    displayResultado.innerText = '';
}

function atualizarTela(numero){
    document.getElementById('mostrar_num').innerText = numero;
    const bola = document.getElementById('b' + numero);
    if(bola){
        bola.classList.remove('bolinha', 'bolinha2');
        bola.classList.add('marcado', 'ultimas');
    }
    
    // Atualiza o histórico visual
    historico.unshift(numero);
    if(historico.length > 4) historico.pop();
    
    document.getElementById('ultimo').innerText = historico[0] || '';
    document.getElementById('penultimo').innerText = historico[1] || '';
    document.getElementById('antepenultimo').innerText = historico[2] || '';
    document.getElementById('anteantepenultimo').innerText = historico[3] || '';
}

// CARGA INICIAL
document.addEventListener("DOMContentLoaded", function() {
    aplicarCores();
    // Marca na tela tudo que já foi sorteado antes
    numerosJaSorteadosNoBanco.forEach(num => {
        atualizarTela(num.toString());
    });
});

// --- FUNÇÃO DE DISPARO COM TRAVAS ---
function dispararSorteio() {
    const numDigitado = campo.value.trim();
    
    if (!numDigitado) return;

    const n = parseInt(numDigitado);

    // 1. VALIDAÇÃO DE INTERVALO (1 a 60)
    if (n < 1 || n > 60) {
        alert("Erro: Digite um número entre 01 e 60.");
        limpar();
        return;
    }

    // 2. VALIDAÇÃO DE DUPLICIDADE
    if (numerosJaSorteadosNoBanco.includes(numDigitado) || numerosJaSorteadosNoBanco.includes(n.toString())) {
        alert("Atenção: O número " + numDigitado + " já foi sorteado!");
        limpar();
        return;
    }

    // Se passar nas travas, envia
    socket.emit('enviar_numero', { 
        numero: numDigitado, 
        projeto_id: projetoIdAtual 
    });

    // Adiciona à lista local para não repetir antes do refresh
    numerosJaSorteadosNoBanco.push(numDigitado);

    atualizarTela(numDigitado);
    displayResultado.innerText = numDigitado;
    limpar();
}

// --- ESCUTAS DE STATUS DO SORTEIO (ADMIN TAMBÉM VÊ) ---

socket.on('vencedor_encontrado', function(data) {
    const g = data.ganhadores[0];
    alert("🚨 GANHADOR IDENTIFICADO NO SISTEMA! 🚨\nNome: " + g.nome + "\nBilhete: " + g.numero_bilhete);
});

socket.on('proxima_rodada', function(data) {
    console.log(data.mensagem);
    // Opcional: mostrar um aviso discreto no painel do admin
});

socket.on('usuarios_atualizados', function(data) {
    const container = document.getElementById('vencedor');
    if(!container) return;
    container.innerHTML = '';
    const vistos = new Set();
    const usuariosUnicos = data.usuarios.filter(u => {
        if (vistos.has(u.nome_usuario)) return false;
        vistos.add(u.nome_usuario);
        return true;
    });
    usuariosUnicos.forEach(b => {
        const div = document.createElement('div');
        div.classList.add('user-entry');
        const imgUrl = (b.lista_urls_img_bilhetes && b.lista_urls_img_bilhetes.length > 0) 
                       ? b.lista_urls_img_bilhetes[0] : '/static/img/default-user.png';
        div.innerHTML = `
            <img src="${imgUrl}" class="perfil" onclick="abrirImagem(this.src)">
            <span class="nome">${b.nome_usuario}</span>
            <span class="cidade">${b.payment_id}</span>
        `;
        container.appendChild(div);
    });
    aplicarCores();
});

function abrirImagem(src) {
    const modal = document.getElementById("modalImg");
    const img = document.getElementById("imgExpandida");
    if(modal && img) { modal.style.display = "flex"; img.src = src; }
}

const modalImg = document.getElementById("modalImg");
if(modalImg) { modalImg.onclick = function() { this.style.display = "none"; }; }

</script>
