<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação - Reconhecimento Facial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0e17;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .camera-view {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            pointer-events: none;
            opacity: 0.3;
            z-index: 2;
        }

        .grid-cell {
            border: 1px dashed #00ffcc;
        }

        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            box-shadow: 0 0 15px #00ffcc;
            animation: scanning 2.5s ease-in-out infinite;
            z-index: 4;
        }

        @keyframes scanning {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .face-frame {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 45%;
            border: 2px solid #00ffcc;
            border-radius: 40% 40% 50% 50%;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4),
                        inset 0 0 20px rgba(0, 255, 204, 0.2);
            animation: pulse 1.5s infinite alternate;
            z-index: 3;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                border-color: #00ffcc;
            }
            100% {
                transform: scale(1.05);
                border-color: #00e6ff;
            }
        }

        .face-point {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .p1 { top: 35%; left: 35%; }
        .p2 { top: 35%; left: 65%; }
        .p3 { top: 45%; left: 50%; }
        .p4 { top: 55%; left: 40%; }
        .p5 { top: 55%; left: 60%; }

        .ui-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            background: rgba(10, 14, 23, 0.9);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            z-index: 5;
        }

        .status-text {
            color: #00ffcc;
            font-weight: bold;
            letter-spacing: 1.5px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .instruction {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        @media (max-width: 500px) {
            .camera-container {
                max-width: 100%;
                max-height: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

<div class="camera-container">

    <div class="camera-view">

        <video id="camera" autoplay playsinline muted></video>

        <div class="grid-overlay">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <div class="face-frame">
            <div class="face-point p1"></div>
            <div class="face-point p2"></div>
            <div class="face-point p3"></div>
            <div class="face-point p4"></div>
            <div class="face-point p5"></div>
        </div>

        <div class="scanner-laser"></div>

    </div>

    <div class="ui-footer">
        <div class="status-text">ESCANEAR ROSTO...</div>
        <div class="instruction">
            Mantenha seu rosto centralizado e iluminado.
        </div>
    </div>

</div>

<script>
const footer = document.querySelector(".ui-footer");

footer.insertAdjacentHTML(
    "beforeend",
    `
    <button id="btnCamera" style="
        margin-top:12px;
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        background:#00ffcc;
        color:#000;
        font-weight:bold;
        cursor:pointer;
    ">
        ATIVAR CÂMERA
    </button>
    `
);

document.getElementById("btnCamera").addEventListener("click", iniciarCamera);

async function iniciarCamera() {
    // 1. Validação de segurança: verifica se a API existe no navegador
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.querySelector(".status-text").textContent = "AMBIENTE NÃO SEGURO (REQUER HTTPS)";
        alert("O acesso à câmera requer uma conexão segura (HTTPS) ou ambiente de testes local (localhost).");
        return;
    }

    try {
        document.querySelector(".status-text").textContent = "SOLICITANDO PERMISSÃO...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        document.getElementById("camera").srcObject = stream;

        document.querySelector(".status-text").textContent = "CÂMERA ATIVA";
        document.getElementById("btnCamera").style.display = "none";

    } catch (erro) {
        console.error(erro);
        
        // Trata caso o usuário recuse a permissão explicitamente
        if (erro.name === "NotAllowedError" || erro.name === "PermissionDeniedError") {
            document.querySelector(".status-text").textContent = "PERMISSÃO NEGADA PELO USUÁRIO";
        } else {
            document.querySelector(".status-text").textContent = "ERRO AO ACESSAR CÂMERA";
        }
    }
}
</script>


</body>
</html>
