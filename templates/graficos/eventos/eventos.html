<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos e Assinaturas</title>
    <style> 
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff;
        }

        /* HEADER FIXO */
        header {
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            background: #052753;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo { max-width: 130px; height: auto; }

        /* ESPAÇO PARA O HEADER */
        .wrapper { padding-top: 70px; }

        /* CARROSSEL LATERAL */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-container::-webkit-scrollbar { display: none; }

        /* ESTILO DOS CARDS */
        .project-card {
            flex: 0 0 85%;
            scroll-snap-align: center;
            background-color: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-card img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            background: #111;
        }

        .content { padding: 15px; text-align: center; flex-grow: 1; }
        .content h3 { margin: 5px 0; font-size: 1.1rem; }
        .premiação { margin-bottom: 10px; font-size: 0.85rem; }

        /* BOTÕES */
        .btn-participar {
            display: block;
            padding: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .btn-whatsapp { background-color: #25d366 !important; }

        /* ESTILO ESPECÍFICO DO CARD ASSINATURA */
        .pacotes-list {
            text-align: left;
            background: #161616;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .pacote-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        .pacote-row:last-child { border-bottom: none; }
        
        .temas {
            color: #f68a05;
            font-size: 0.75rem;
            font-weight: bold;
            margin: 10px 0;
        }

        footer { text-align: center; padding: 20px; color: #555; font-size: 0.75rem; }

        @media (min-width: 768px) {
            .project-card { flex: 0 0 300px; }
            .carousel-container { justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>

                        Participar
                    </a>

            </div>
