<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#000">
        <title>Registro vendedores</title>
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='w.png') }}">
        <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='w.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/registro_vendedores.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">                  
</head>

 <body>


<div  class="container py-4">
    
    <!-- Formulário de Registro -->
    <div style=" text-align: center;" class="card mb-4">
        <div style="text-align: center; font-family: monospace; font-weight: bold;"></div>
        <div class="card-body">
            
            <form style="font-family: monospace; font-weight: bold;" id="formRegistro">
                  <img 
    src="{{ url_for('static', filename='img/marca.png') }}"
    style="display: block; margin: 0 auto; width:100%; height: 100%;">


    <div class="mb-3">
        <input id="nome" type="text" class="form-control" name="nome" placeholder="Digite seu nome" required>
    </div>

    <div class="mb-3">
        <input id="sobrenome" type="text" class="form-control" name="sobrenome" placeholder="Digite seu sobrenome" required>
    </div>

    <div class="mb-3">
        <input id="cpf" type="text" class="form-control" name="cpf" placeholder="Digite seu CPF (s/ pontos)" pattern="\d{11}" required>
    </div>

 <div  class="mb-3">
    <label >Data Nascimento</label>
    <input id="dt_nascimento" type="date" class="form-control" name="dt_nascimento"  required>
</div>

    <div class="mb-3">
        <input id="email" type="text" class="form-control" name="email" placeholder="Digite seu email" required>
    </div>

 
    <div class="mb-3">
        <input id="chave_pix" type="text" class="form-control" name="chave_pix" placeholder="Digite sua chave PIX" required>
    </div>

    <div style="display: none;" class="mb-3">
        <input id="comissao" type="text" class="form-control" name="comissao"  value="30%">
    </div>

    <!-- BOTÃO SEMPRE POR ÚLTIMO -->
    <button style="border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: bold; transition: all 0.3s ease;" type="submit" class="btn btn-success w-100">
        CONFIRMAR REGISTRO
    </button>
</form>
            <div id="registroMsg" class="mt-2"></div>
        </div>


    <a href="/vitoria_visionaria/login/vendedor" class="btn-voltar">
    <span class="seta">←</span> Voltar
    </a>
    </div>


    </div>
</div>

<script src="{{ url_for('static', filename='js/registro_login_vendedores.js') }}"></script>



</body>
</html>
